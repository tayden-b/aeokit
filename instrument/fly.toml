# fly.toml app configuration file generated for aeokit on 2026-08-28T09:45:00-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'aeokit'
primary_region = 'iad'

[build]
[env]
  AEOKIT_DAILY_USD_CAP = '5.00'
  AEOKIT_DATA_DIR = '/data'
  AEOKIT_FREE_PROBES_PER_CLIENT = '1'
  PORT = '8080'

[[mounts]]
  source = 'aeokit_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
