[project]
name = "aeokit-mcp"
version = "0.1.0"
description = "Measure whether AI answer engines recommend your product. An MCP server for live AEO measurement."
readme = "PACKAGE.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tayden Barretto" }]
keywords = ["mcp", "aeo", "geo", "ai-search", "answer-engine-optimization", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
  "mcp>=2.0",
  "openai>=1.40",
  "google-genai>=1.0",
  "anthropic>=0.40",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "certifi",
]

[project.urls]
Homepage = "https://aeokit.ai"
Source = "https://github.com/tayden-b/aeokit"

[project.scripts]
aeokit-mcp = "aeokit_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aeokit_mcp"]
